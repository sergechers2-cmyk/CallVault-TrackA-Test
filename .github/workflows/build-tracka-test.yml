name: Build CallVault Track A Diagnostic

on:
  push:
    branches: [main, tracka-diagnostic-2-self-daemon]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Fetch pinned upstream CallVault v2.2.0
        shell: bash
        run: |
          git clone --depth 1 --branch v2.2.0 --recursive https://github.com/madkongo/CallVault.git upstream
          test -f upstream/app/src/main/java/com/baba/callvault/services/recording/handoff/TrackAProbe.kt

      - name: Apply Track A test overlay
        run: python3 scripts/apply_tracka.py

      - name: Build isolated debug APK
        shell: bash
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PisolateTestApp --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -f upstream/app/build/outputs/apk/debug/app-debug.apk
          sha256sum upstream/app/build/outputs/apk/debug/app-debug.apk | tee tracka-test.sha256
          # Activities are compiled into DEX files, so their Kotlin source filename
          # does not appear in the APK ZIP listing. Verify the class is present in DEX.
          unzip -p upstream/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' | strings | grep -q 'TrackATestActivity'
          # Verify that the isolated daemon authority was patched to match the isolated manifest authority.
          unzip -p upstream/app/build/outputs/apk/debug/app-debug.apk 'classes*.dex' | strings | grep -q 'com.baba.callvault.instrtest.recorder'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallVault-TrackA-DIAGNOSTIC-2-v2.2.0
          path: |
            upstream/app/build/outputs/apk/debug/app-debug.apk
            tracka-test.sha256
            upstream/build/reports/problems/problems-report.html
          if-no-files-found: error
