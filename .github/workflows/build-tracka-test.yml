name: Build CallVault Track A Diagnostic 3

on:
  push:
    branches: [main, tracka-diagnostic-3-separate-app]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Fetch pinned upstream CallVault v2.2.0
        shell: bash
        run: |
          git clone --depth 1 --branch v2.2.0 --recursive https://github.com/madkongo/CallVault.git upstream
          test -f upstream/app/src/main/java/com/baba/callvault/services/recording/handoff/TrackAProbe.kt

      - name: Apply Track A DIAGNOSTIC-3 overlay
        run: python3 scripts/apply_tracka.py

      - name: Build isolated debug APK
        shell: bash
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug -PisolateTestApp --no-daemon

      - name: Verify APK identity and Track A wiring
        shell: bash
        run: |
          APK=upstream/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          sha256sum "$APK" | tee tracka-test.sha256
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -q "package: name='com.baba.callvault.trackadiag3'"
          "$AAPT" dump badging "$APK" | grep -q "application-label:'CallVault Track A DIAGNOSTIC 3'"
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'TrackATestActivity'
          unzip -p "$APK" 'classes*.dex' | strings | grep -q 'com.baba.callvault.trackadiag3.recorder'
          if unzip -p "$APK" 'classes*.dex' | strings | grep -q 'com.baba.callvault.instrtest.recorder'; then
            echo "Old DIAGNOSTIC-2 authority leaked into DIAGNOSTIC-3 APK"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallVault-TrackA-DIAGNOSTIC-3-v2.2.0
          path: |
            upstream/app/build/outputs/apk/debug/app-debug.apk
            tracka-test.sha256
            upstream/build/reports/problems/problems-report.html
          if-no-files-found: error
